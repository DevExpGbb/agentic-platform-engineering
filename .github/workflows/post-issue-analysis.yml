name: Post Issue Analysis

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to post analysis to'
        required: true
        default: '12'

permissions:
  issues: write
  contents: read

jobs:
  post-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Post analysis as comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Read the analysis file
            const commentBody = fs.readFileSync('.github/ISSUE_12_ANALYSIS.md', 'utf8');
            
            // Clean up the note section at the end
            const cleanedBody = commentBody.replace(/---\n\n\*\*Note:\*\*.*$/s, '').trim();
            
            // Post the comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.inputs.issue_number }},
              body: cleanedBody
            });
            
            console.log(`Posted analysis to issue #${{ github.event.inputs.issue_number }}`);
